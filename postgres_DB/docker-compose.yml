version: "3.8"
services:
  db:
    image: postgres:18
    container_name: pgdb_cont
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: yagnik
      POSTGRES_PASSWORD: 123
    volumes:
      - local_pgdata:/var/lib/postgresql
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_container
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: yagnik@yagnik.com
      PGADMIN_DEFAULT_PASSWORD: 123
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  local_pgdata:
  pgadmin-data:
